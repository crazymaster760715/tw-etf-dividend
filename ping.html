<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>連線測試</title>
<style>body{font:16px/1.7 system-ui,sans-serif;padding:20px;background:#fff;color:#111}h2{margin:0 0 8px}.ok{color:#15803d}.bad{color:#b91c1c}.w{color:#b45309}small{color:#666;word-break:break-all}</style></head>
<body>
<h2>✅ 網站連得上</h2>
<div>能看到這行字，代表 github.io 這個網站本身沒問題。</div>
<small id="ua"></small>
<hr>
<div id="out">測試中…（最多約 10 秒）</div>
<script>
document.getElementById("ua").textContent = navigator.userAgent;
var out = document.getElementById("out"); out.innerHTML = "";
function line(cls, t){ var d = document.createElement("div"); d.className = cls; d.textContent = t; out.appendChild(d); }
function timed(name, url, opt, ms){
  var t0 = Date.now(), done = false;
  var timer = setTimeout(function(){ if(!done){ done = true; line("bad", "❌ " + name + "：超過 " + (ms/1000) + " 秒沒回應"); } }, ms);
  return fetch(url, opt).then(function(r){ return r.arrayBuffer().then(function(b){
    if(done) return; done = true; clearTimeout(timer);
    line(r.ok || r.type == "opaque" ? "ok" : "bad", (r.ok || r.type == "opaque" ? "✅ " : "❌ ") + name + "：" + (Date.now() - t0) + " ms" + (b.byteLength ? "，" + Math.round(b.byteLength/1024) + " KB" : "") + (r.status ? "（HTTP " + r.status + "）" : ""));
  }); }).catch(function(e){ if(done) return; done = true; clearTimeout(timer); line("bad", "❌ " + name + "：失敗 " + e.message); });
}
var t0 = Date.now(), x = 0; for (var i = 0; i < 3e6; i++) x += i % 7;
line("ok", "✅ 手機運算速度：" + (Date.now() - t0) + " ms");
try { localStorage.setItem("p", "1"); localStorage.removeItem("p"); line("ok", "✅ localStorage 可用"); } catch(e) { line("bad", "❌ localStorage 不可用：" + e.message); }
var q = "?" + Date.now();
timed("本站小資料檔 upcoming.json", "data/upcoming.json" + q, {cache:"no-store"}, 10000)
  .then(function(){ return timed("本站大資料檔 summary.json", "data/summary.json" + q, {cache:"no-store"}, 10000); })
  .then(function(){ return timed("本站主頁 index.html", "index.html" + q, {cache:"no-store"}, 10000); })
  .then(function(){ return timed("Google 字型 fonts.googleapis.com", "https://fonts.googleapis.com/css2?family=Inter", {mode:"no-cors", cache:"no-store"}, 6000); })
  .then(function(){ line("w", "— 測試完成，請把這個畫面截圖給我 —"); });
</script></body></html>
